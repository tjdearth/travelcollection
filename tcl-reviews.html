<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Collection — Guest Reviews</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Source+Sans+Pro:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-bg: #faf9f7;
      --color-text: #2c2c2c;
      --color-muted: #8a8580;
      --color-border: #e8e4df;
      --color-card-bg: #ffffff;
      --color-accent: #1a3a2a;
      --shadow-card: 0 2px 20px rgba(0,0,0,0.04), 0 1px 4px rgba(0,0,0,0.03);
      --radius: 10px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Source Sans Pro', sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 48px 24px 32px;
    }

    header h1 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 500;
      font-size: 2.2rem;
      color: var(--color-accent);
      letter-spacing: 0.02em;
    }

    header p {
      font-weight: 300;
      font-size: 1rem;
      color: var(--color-muted);
      margin-top: 6px;
      letter-spacing: 0.03em;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 16px;
      max-width: 1800px;
      margin: 0 auto;
      padding: 0 24px 60px;
    }

    .card {
      background: var(--color-card-bg);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: var(--shadow-card);
      transition: box-shadow 0.3s ease, transform 0.3s ease;
    }

    .card:hover {
      box-shadow: 0 6px 32px rgba(0,0,0,0.07), 0 2px 8px rgba(0,0,0,0.04);
      transform: translateY(-2px);
    }

    .card .logo-wrap {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 60px;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--color-border);
    }

    .card .logo-wrap img {
      max-height: 50px;
      max-width: 100%;
      object-fit: contain;
    }

    .card .widget-frame {
      width: 100%;
      border: none;
      min-height: 120px;
      display: block;
      margin: 0 auto;
    }

    @media (max-width: 1400px) {
      .grid { grid-template-columns: repeat(4, 1fr); }
    }
    @media (max-width: 800px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 480px) {
      .grid {
        grid-template-columns: 1fr;
        padding: 0 16px 40px;
      }
      header h1 { font-size: 1.6rem; }
    }
  </style>
</head>
<body>

  </header>

  <div class="grid" id="brandGrid"></div>

    var grid = document.getElementById('brandGrid');

    brands.forEach(function (brand) {
      // Build an isolated HTML document for each widget inside its own iframe
      var iframeSrc = '<!DOCTYPE html><html><head><style>body{margin:0;font-family:sans-serif;display:flex;justify-content:center;align-items:flex-start;min-height:100%;}</style></head><body>'
        + '<div><script src="https://cdn.wetravel.com/widgets/embed_reviews.js" '
        + 'id="wetravel_review_widget" '
        + 'data-env="https://www.wetravel.com" '
        + 'data-version="v0.3" '
        + 'data-userslug="' + brand.uid + '" '
        + 'data-uid="' + brand.uid + '" '
        + 'data-showstars="true" '
        + 'data-showcount="true" '
        + 'data-name="WeTravel Review Widget"><\/script></div>'
        + '</body></html>';

      var card = document.createElement('div');
      card.className = 'card';
      card.innerHTML =
        '<div class="logo-wrap"><img src="' + brand.logo + '" alt="' + brand.name + '"></div>';

      var iframe = document.createElement('iframe');
      iframe.className = 'widget-frame';
      iframe.setAttribute('scrolling', 'no');
      iframe.setAttribute('frameborder', '0');
      iframe.srcdoc = iframeSrc;
      card.appendChild(iframe);

      grid.appendChild(card);
    });
  </script>

</body>
</html>
