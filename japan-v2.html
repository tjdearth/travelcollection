          <section key={day.dy} ref={el=>refs.current[`d${day.dy}`]=el} className={`min-h-screen px-6 py-20 ${di%2===0?'bg-white':'bg-stone-50'}`} style={dark?{background:'#1a1a2e'}:{}}>
            <div className="lg:hidden -mx-6 -mt-20 mb-6 h-48 bg-cover bg-center relative" style={{backgroundImage:`url(${H[day.hk]})`}}><div className="absolute inset-0 bg-gradient-to-t from-white via-transparent to-transparent"/></div>
            <div className="max-w-2xl mx-auto"><div className="text-center mb-10"><p className="text-xs text-stone-400 tracking-widest uppercase mb-1">{day.dt}</p><h2 className="font-serif text-3xl italic" style={{color:B.dg}}>Day {day.dy}</h2><p className="mt-1" style={{color:B.dg}}>{day.loc}</p>{tripStatus.status==='during'&&tripStatus.day===day.dy&&<span className="inline-block mt-2 px-3 py-1 rounded-full text-xs font-bold text-white" style={{backgroundColor:B.dg}}>📍 TODAY</span>}</div>
              <div className="space-y-4">{day.act.map((a,ai)=>{const isExp=exp[`${di}-${ai}`];const nk=`${di}-${ai}`;const isExperience=a.t==='act';const accInfo=a.t==='acc'&&a.g?D.acc.find(x=>x.g===a.g):null;return(
                <div key={ai} className={`rounded-xl border transition-all ${isExperience?'bg-gradient-to-br from-white to-stone-50 shadow-sm':a.nt?'bg-amber-50':'bg-white'}`} style={isExperience?{borderColor:B.dg,borderWidth:'1.5px'}:a.nt?{borderColor:'#F59E0B'}:{borderColor:'#e7e5e4'}}>
                  <div className={`p-4 ${a.t!=='info'?'cursor-pointer':''}`} onClick={()=>a.t!=='info'&&tog(di,ai)}>
                    <div className="flex items-start gap-3">
                      <div className={`p-2 rounded-lg shrink-0`} style={{backgroundColor:isExperience?B.dg:a.nt?'#FEF3C7':'#f5f5f4'}}>{getIc(a.i,isExperience?'text-white':'',{color:isExperience?'#fff':a.nt?'#D97706':B.dg})}</div>
                      <div className="flex-1 min-w-0"><div className="flex items-start justify-between gap-2"><div>{isExperience&&<span className="inline-block text-xs font-medium tracking-wide uppercase px-2 py-0.5 rounded mb-1.5" style={{backgroundColor:B.g,color:B.dk}}>Experience</span>}<h3 className={`font-medium text-stone-800 ${isExperience?'text-base':'text-sm'}`}>{a.ti}</h3>{a.tm&&<p className="text-sm mt-0.5" style={{color:B.dg}}>{a.tm}</p>}{a.loc&&<div className="flex items-center gap-2 mt-0.5"><p className="text-sm text-stone-500">{a.loc}</p>{accInfo&&accInfo.stars&&<span className="text-xs">{'★'.repeat(accInfo.stars)}{'☆'.repeat(5-accInfo.stars)}</span>}</div>}</div>{a.t!=='info'&&<Ic.ChR c={`w-5 h-5 text-stone-400 transition-transform ${isExp?'rotate-90':''}`}/>}</div>{a.nt&&<p className="text-sm mt-2 italic" style={{color:'#92700C'}}>{a.ds}</p>}{a.t==='acc'&&a.ad&&<a href={`https://maps.google.com/search/${encodeURIComponent(a.ad)}`} target="_blank" rel="noopener noreferrer" className="text-sm mt-1 flex items-center gap-1 hover:opacity-70" style={{color:B.dg}}>📍 <span className="truncate">{a.ad}</span></a>}</div>
                    </div>
                  </div>
                  {isExp&&a.t!=='info'&&<div className="px-4 pb-4 border-t border-stone-100 pt-3"><div className="ml-11 space-y-3 text-sm">{isExperience&&a.eds&&<p className="text-stone-600 leading-relaxed">{a.eds}</p>}{!isExperience&&a.ds&&<p className="text-stone-600">{a.ds}</p>}{a.dur&&<div className="flex items-center gap-2 text-stone-500"><Ic.Cl c="w-4 h-4"/>Duration: {a.dur}</div>}{accInfo&&<div className="bg-stone-50 rounded-lg p-3 mt-2"><p className="text-stone-600 text-sm">{accInfo.ds}</p></div>}{a.g&&G[a.g]&&<Gal imgs={G[a.g]} name={isExperience?a.ti:a.loc} isExp={isExperience}/>}{accInfo&&<div className="mt-3 pt-3 border-t border-stone-200"><div className="flex items-center gap-2 mb-1"><Ic.Bd c="w-4 h-4" style={{color:B.dg}}/><span className="text-xs font-medium text-stone-700">Room Category</span></div><p className="text-sm text-stone-800 font-medium">{accInfo.dt}</p>{accInfo.roomImgs?<div className="flex gap-2 mt-2 overflow-x-auto hide-scrollbar">{accInfo.roomImgs.map((img,ri)=>(<div key={ri} className="flex-shrink-0 w-36 h-24 rounded-lg overflow-hidden bg-stone-100"><img src={img.u} alt={img.c} className="w-full h-full object-cover" loading="lazy"/></div>))}</div>:<p className="text-xs text-stone-400 mt-0.5 italic">Room photos available upon request</p>}</div>}</div>{edit&&<div className="ml-11 mt-3 border-2 border-dashed rounded-lg p-3" style={{borderColor:B.dk}}><label className="text-xs font-medium block mb-2" style={{color:B.dk}}>Ops Note</label><textarea value={notes[nk]||''} onChange={e=>setNotes(p=>({...p,[nk]:e.target.value.slice(0,200)}))} placeholder="Add note..." className="w-full text-sm border border-stone-200 rounded-lg p-2 resize-none focus:outline-none" rows={2}/></div>}{!edit&&notes[nk]&&<div className="ml-11 mt-3 bg-amber-50 border-l-4 border-amber-400 rounded-r-lg px-4 py-2.5"><span className="text-sm text-amber-800"><strong>Note:</strong> {notes[nk]}</span></div>}</div>}
                </div>);})}</div>
            </div>
          </section>
        ))}
        {/* DINING */}
        <section ref={el=>refs.current['dining']=el} className="min-h-screen px-6 py-20" style={{background:dark?'#1a1a2e':'linear-gradient(180deg,#FFF8F0,#FDF2E9)'}}>
          <h2 className="font-serif text-3xl text-center mb-3 italic" style={{color:B.dg}}>Dining Recommendations</h2>
          <p className="text-center text-stone-500 mb-10">Curated picks near your accommodations</p>
          <div className="max-w-3xl mx-auto space-y-8">{DINING.map((area,ai)=>(
            <div key={ai}><h3 className="text-lg font-medium mb-4 flex items-center gap-2" style={{color:B.dg}}><span className="text-2xl">{area.icon}</span>{area.area}</h3>
              <div className="grid gap-3">{area.recs.map((r,ri)=>(
                <div key={ri} className="bg-white rounded-xl p-4 border border-stone-200 hover:shadow-sm transition-shadow" style={dark?{background:'#22223a',borderColor:'#333'}:{}}>
                  <div className="flex items-start justify-between gap-3"><div className="flex-1"><h4 className="font-medium text-stone-800">{r.name}</h4><div className="flex items-center gap-2 mt-1"><span className="text-xs px-2 py-0.5 rounded-full bg-stone-100" style={dark?{background:'#2a2a3e'}:{}}>{r.type}</span><span className="text-xs font-medium" style={{color:B.dg}}>{r.price}</span></div><p className="text-sm text-stone-600 mt-2">{r.desc}</p></div>{r.maps&&<a href={r.maps} target="_blank" rel="noopener noreferrer" className="text-xs shrink-0 px-3 py-1.5 rounded-lg border border-stone-200 hover:bg-stone-50 flex items-center gap-1" style={{color:B.dg}}>📍 Map</a>}</div>
                </div>
              ))}</div>
            </div>
          ))}</div>
        </section>
        {/* EMERGENCY */}
        <section ref={el=>refs.current['emg']=el} className="min-h-screen px-6 py-20" style={{backgroundColor:'#8C1A33'}}>
          <h2 className="font-serif text-3xl text-white text-center mb-10 italic">Emergency Contacts</h2>
          <div className="max-w-2xl mx-auto"><div className="bg-white/15 backdrop-blur-sm rounded-xl p-6 space-y-5">
            <div><h3 className="text-sm tracking-wide uppercase mb-3 text-amber-300">Oshinobi Travel — Weekdays until 6 PM</h3><p className="text-white mb-2">Primary: <span className="font-semibold">{D.em.tm}</span></p><a href={`tel:${D.em.tmPh}`} className="inline-flex items-center gap-2 bg-white/20 hover:bg-white/30 px-4 py-2 rounded-lg text-white"><Ic.Ph c="w-5 h-5"/>{D.em.tmPh}</a></div>
            <div className="border-t border-white/30 pt-5"><h3 className="text-sm tracking-wide uppercase mb-3 text-red-300">Emergency — All Other Times (24/7)</h3><p className="text-white mb-2">{D.em.epName}: <span className="font-semibold">{D.em.ep}</span></p><a href={`tel:${D.em.ep}`} className="inline-flex items-center gap-2 bg-red-600 hover:bg-red-700 px-4 py-2 rounded-lg text-white font-medium"><Ic.Ph c="w-5 h-5"/>{D.em.ep}</a></div>
            <div className="border-t border-white/30 pt-5"><a href={`https://wa.me/${D.em.wa}`} target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-2 bg-green-600 hover:bg-green-700 px-4 py-2 rounded-lg text-white"><Ic.Wa c="w-5 h-5"/>WhatsApp Oshinobi Travel</a></div>
            <div className="border-t border-white/30 pt-5"><h3 className="text-sm tracking-wide uppercase mb-3 text-stone-300">Additional Support</h3><div className="space-y-2 text-white/80 text-sm"><p>Japan Visitor Hotline (24hrs): <a href="tel:+81-50-3816-2787" className="text-amber-300">{D.em.hotline}</a></p><p>Police: <span className="text-amber-300">Dial {D.em.police}</span></p><p>Ambulance / Fire: <span className="text-amber-300">Dial {D.em.ambulance}</span></p></div></div>
          </div></div>
        </section>
        {/* PLACES */}
        <section ref={el=>refs.current['places']=el} className="min-h-screen px-6 py-20" style={{background:dark?'#1a1a2e':'linear-gradient(180deg,#F5F2ED,#E8E4DD)'}}>
          <h2 className="font-serif text-3xl text-center mb-3 italic" style={{color:B.dg}}>The Places You'll Go</h2>
          <p className="text-center text-stone-500 mb-10">Discover the magic of Japan</p>
          <div className="max-w-3xl mx-auto space-y-4">{D.places.map((place,i)=>{const isOpen=placesOpen[place.id];return(
            <div key={i} className="bg-white rounded-2xl shadow-sm border border-stone-200 overflow-hidden" style={dark?{background:'#22223a',borderColor:'#333'}:{}}>
              <button onClick={()=>togPlace(place.id)} className="w-full text-left"><div className="flex items-center gap-4 p-4"><span className="w-10 h-10 rounded-full flex items-center justify-center text-white text-sm font-semibold shrink-0" style={{background:B.dg}}>{i+1}</span><div className="flex-1"><h3 className="font-serif text-xl italic" style={{color:B.dg}}>Experience {place.name}</h3></div><Ic.ChD c={`w-5 h-5 text-stone-400 shrink-0 transition-transform ${isOpen?'rotate-180':''}`}/></div></button>
              {isOpen&&<div className="px-4 pb-4"><div className="w-full h-48 md:h-64 rounded-xl overflow-hidden mb-4"><img src={place.img} alt={place.name} className="w-full h-full object-cover"/></div><p className="text-stone-600">{place.desc}</p></div>}
            </div>);})}</div>
        </section>
        {/* FAQ */}
        <section ref={el=>refs.current['faq']=el} className="min-h-screen px-6 py-20" style={{background:dark?'#1a1a2e':'linear-gradient(180deg,#FDF8F3,#F5EDE4)'}}>
          <h2 className="font-serif text-3xl text-center mb-3 italic" style={{color:B.dg}}>Destination FAQ</h2>
          <p className="text-center text-stone-500 mb-10">Everything about traveling in Japan</p>
          <div className="max-w-3xl mx-auto space-y-6">{D.faq.map((cat,ci)=>(
            <div key={ci} className="bg-white rounded-2xl shadow-sm border border-stone-200 overflow-hidden" style={dark?{background:'#22223a',borderColor:'#333'}:{}}>
              <div className="px-6 py-4 border-b border-stone-100" style={{background:dark?'#2a2a3e':'linear-gradient(90deg,#FAF5F0,#FFF)'}}><h3 className="font-medium text-lg flex items-center gap-3" style={{color:B.dg}}><span className="text-2xl">{cat.icon}</span>{cat.cat}</h3></div>
              <div className="divide-y divide-stone-100">{cat.items.map((item,qi)=>{const isOpen=faqOpen[`${ci}-${qi}`];return(<div key={qi}><button onClick={()=>togFaq(ci,qi)} className="w-full px-6 py-4 text-left flex items-start justify-between gap-4 hover:bg-stone-50"><span className="font-medium text-stone-700">{item.q}</span><Ic.ChD c={`w-5 h-5 text-stone-400 shrink-0 transition-transform ${isOpen?'rotate-180':''}`}/></button>{isOpen&&<div className="px-6 pb-4 -mt-2"><p className="text-stone-600 text-sm leading-relaxed pl-4 border-l-2" style={{borderColor:B.dg}}>{item.a}</p></div>}</div>);})}</div>
            </div>
          ))}</div>
        </section>
        {/* DOCUMENT WALLET */}
        <section ref={el=>refs.current['docs']=el} className="min-h-screen px-6 py-20 bg-stone-50" style={dark?{background:'#1a1a2e'}:{}}>
          <h2 className="font-serif text-3xl text-center mb-3 italic" style={{color:B.dg}}>Document Wallet</h2>
          <p className="text-center text-stone-500 mb-8">Your travel documents at a glance</p>
          <div className="max-w-2xl mx-auto space-y-3">{DOCS.map((doc,i)=>{
            const icons={flight:'✈️',hotel:'🏨',ticket:'🎫',insurance:'🛡️',id:'🛂'};
            const statusColors={confirmed:{bg:'#D1FAE5',text:'#065F46',label:'Confirmed'},'at hotel':{bg:'#FEF3C7',text:'#92400E',label:'At Hotel'},upload:{bg:'#f5f5f4',text:'#78716c',label:'Upload'}};
            const st=statusColors[doc.status];
            return(<div key={i} className="bg-white rounded-xl p-4 border border-stone-200 flex items-center gap-4" style={dark?{background:'#22223a',borderColor:'#333'}:{}}>
              <span className="text-2xl">{icons[doc.type]}</span>
              <div className="flex-1 min-w-0"><h4 className="font-medium text-stone-800 text-sm truncate">{doc.name}</h4></div>
              <span className="text-xs font-medium px-2.5 py-1 rounded-full shrink-0" style={{backgroundColor:st.bg,color:st.text}}>{st.label}</span>
            </div>);
          })}</div>
          <div className="max-w-2xl mx-auto mt-6 text-center"><p className="text-sm text-stone-500">Need to upload documents? Share them via WhatsApp with your Oshinobi Travel contact.</p></div>
        </section>
        {/* FOOTER */}
        <footer className="py-12 px-6 text-center" style={{backgroundColor:B.dg}}>
          <img src={LOGO} alt="Oshinobi" className="h-16 mx-auto mb-4 brightness-0 invert" onError={(e)=>{e.target.style.display='none';}}/>
          <p className="text-white text-lg font-serif italic mb-2">Share Your Experience</p>
          <p className="text-white/80 text-sm mb-4">Tag us in your photos and social media!</p>
          <a href="https://www.instagram.com/oshinobitravel" target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-2 bg-white/20 hover:bg-white/30 px-5 py-2.5 rounded-full text-white transition-colors"><Ic.Ig c="w-5 h-5"/>@oshinobitravel</a>
          <p className="text-white/80 text-sm mt-6">© 2025 Oshinobi Travel</p>
          <p className="text-white/60 text-xs mt-1">Last updated: Feb 3, 2026</p>
        </footer>
      </div></div>
      {/* FLOATING ELEMENTS */}
      {showWaPanel&&<WhatsAppPanel onClose={()=>setShowWaPanel(false)} wa={D.em.wa} name={D.name}/>}
      {fullscreenMap&&<TripMap locs={D.locs} fullscreen={true} onToggleFs={()=>setFullscreenMap(false)} onSelect={()=>{}}/>}
      <button onClick={()=>setShowWaPanel(!showWaPanel)} className={`fixed bottom-5 right-5 text-white px-5 py-2.5 rounded-full shadow-lg hover:scale-105 transition-all flex items-center gap-2 z-30 no-print ${showWaPanel?'':'pulse-ring'}`} style={{backgroundColor:'#25D366'}}><Ic.Wa c="w-5 h-5"/><span className="font-medium">{showWaPanel?'Close':'Chat'}</span></button>
    </div>
  );
}
ReactDOM.render(<App/>,document.getElementById('root'));
</script>
</body>
</html>
